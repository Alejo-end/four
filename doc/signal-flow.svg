<svg xmlns="http://www.w3.org/2000/svg" width="100%" role="img" viewBox="0 0 760 390"><title>four signal flow</title><desc>The input records into one of four tracks. Each track plays its own take through a voice, a filter, colour and two effects. Each track sends to the other tracks, to the shared delay and to the shared reverb. The sum goes to the output, and the tape loops the output.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#898781" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1L8 5L2 9"/></marker><style>text{font-family:-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}.t{font-size:13px;font-weight:600}.s{font-size:11px}.io{fill:#f1efe8;stroke:#5f5e5a}.io-t{fill:#444441}.src{fill:#e1f5ee;stroke:#0f6e56}.src-t{fill:#085041}.fx{fill:#faece7;stroke:#993c1d}.fx-t{fill:#712b13}.frame{stroke-dasharray:4 3}.frame,.ghost{fill:#faf9f5;stroke:#898781}.note{fill:#52514e}.w{fill:none;stroke:#898781;stroke-width:1.5}rect{stroke-width:.75}</style></defs><rect width="760" height="390" x="0" y="0" fill="#FFF" rx="10"/><rect width="484" height="112" x="134" y="46" class="ghost" rx="10"/><rect width="484" height="112" x="128" y="40" class="ghost" rx="10"/><rect width="484" height="112" x="122" y="34" class="ghost" rx="10"/><rect width="484" height="112" x="116" y="28" class="frame" rx="10"/><text x="358" y="42" class="s note">one of four tracks, each with its own 60 s take</text><rect width="64" height="44" x="20" y="72" class="io" rx="8"/><text x="52" y="94" class="t io-t">IN</text><rect width="78" height="60" x="130" y="64" class="src" rx="8"/><text x="169" y="86" class="t src-t">TAKE</text><text x="169" y="104" class="s src-t">record, load</text><rect width="96" height="60" x="226" y="64" class="src" rx="8"/><text x="274" y="80" class="t src-t">VOICE</text><text x="274" y="96" class="s src-t">PLAY GRAIN</text><text x="274" y="110" class="s src-t">WARP PV CLOUD</text><rect width="72" height="60" x="340" y="64" class="fx" rx="8"/><text x="376" y="86" class="t fx-t">FILTER</text><text x="376" y="104" class="s fx-t">LP HP BP</text><rect width="72" height="60" x="430" y="64" class="fx" rx="8"/><text x="466" y="86" class="t fx-t">COLOR</text><text x="466" y="104" class="s fx-t">drive, crush</text><rect width="68" height="60" x="520" y="64" class="fx" rx="8"/><text x="554" y="86" class="t fx-t">EFFECT</text><text x="554" y="104" class="s fx-t">two slots</text><line x1="84" x2="126" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><line x1="208" x2="222" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><line x1="322" x2="336" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><line x1="412" x2="426" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><line x1="502" x2="516" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><rect width="94" height="44" x="646" y="72" class="io" rx="8"/><text x="693" y="87" class="t io-t">LEVEL</text><text x="693" y="103" class="s io-t">four tracks sum</text><line x1="588" x2="642" y1="94" y2="94" marker-end="url(#arrow)" class="w"/><path d="M614 94 L614 232" class="w"/><path marker-end="url(#arrow)" d="M614 190 L274 190 L274 162" class="w"/><text x="420" y="178" class="s note">send to another track</text><path marker-end="url(#arrow)" d="M614 232 L560 232" class="w"/><path marker-end="url(#arrow)" d="M614 232 L614 296 L560 296" class="w"/><text x="640" y="264" class="s note">sends</text><rect width="110" height="44" x="446" y="210" class="fx" rx="8"/><text x="501" y="232" class="t fx-t">DELAY</text><rect width="110" height="44" x="446" y="274" class="fx" rx="8"/><text x="501" y="296" class="t fx-t">REVERB</text><text x="501" y="332" class="s note">shared by the four tracks</text><rect width="110" height="44" x="246" y="242" class="io" rx="8"/><text x="301" y="264" class="t io-t">MIX</text><path marker-end="url(#arrow)" d="M446 232 L400 232 L400 256 L360 256" class="w"/><path marker-end="url(#arrow)" d="M446 296 L400 296 L400 272 L360 272" class="w"/><path marker-end="url(#arrow)" d="M693 116 L693 352 L301 352 L301 290" class="w"/><rect width="116" height="44" x="110" y="304" class="src" rx="8"/><text x="168" y="319" class="t src-t">TAPE</text><text x="168" y="335" class="s src-t">loops input or mix</text><path marker-end="url(#arrow)" d="M270 286 L270 326 L230 326" class="w"/><path marker-end="url(#arrow)" d="M178 304 L178 264 L242 264" class="w"/><rect width="64" height="44" x="20" y="242" class="io" rx="8"/><text x="52" y="264" class="t io-t">OUT</text><path marker-end="url(#arrow)" d="M246 250 L88 250" class="w"/><text x="380" y="374" class="s note">A fresh take plays dry. Every send and every effect starts at zero.</text></svg>